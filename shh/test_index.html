<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Генератор идей для фиков</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <form id="ficForm">
    <h2>Если Вы Это Видите, То Вам Кажется:</h2>
    <h2 class="bytheway">Совершенно Точно Не Генератор Сюжетов Фанфиков (улучшенный) (еще один)✨</h2>

    <div class="form-group">
      <label for="title">Фандом</label>
      <select name="title" id="title">
        <option value="bleach" selected>Bleach</option>
        <option value="arcane">Arcane</option>
        <option value="mha">My Hero Academia</option>
        <option value="khr">Katekyo Hitman Reborn!</option>
        <option value="windbreaker">Wind Breaker</option>
      </select>
    </div>

    <div class="form-group">
      <label for="relationshipSize">Основные персонажи</label>
      <select name="relationshipSize" id="relationshipSize">
        <option value="1">1 (соло)</option>
        <option value="2" selected>2 (классика)</option>
        <option value="3">3 (настроение для тройничка)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="type">Тип</label>
      <select name="type" id="type">
        <option value="slash">Слеш</option>
        <option value="femslash">Фемслеш</option>
        <option value="gen">Джен</option>
      </select>
    </div>

    <div class="form-group">
      <label for="sideCount">Второстепенные персонажи (0-5)</label>
      <input type="number" name="sideCount" id="sideCount" min="0" max="5" value="2">
    </div>

    <div class="form-group">
      <label for="factions">Фракции (необязательно)</label>
      <select name="factions" id="factions" multiple>
        <option value="shinigami">Шинигами</option>
        <option value="espada">Эспада</option>
        <option value="sternritter">Штернриттеры</option>
        <option value="vizard">Вайзарды</option>
        <option value="quincy">Квинси</option>
        <option value="arrancar">Арранкары</option>
      </select>
      <small>Зажмите Ctrl (Cmd) для выбора нескольких. Если не выбрано — пофиг, всех мешаем.</small>
    </div>

    <div class="form-group checkbox-group">
      <input type="checkbox" name="nsfw" id="nsfw">
      <label for="nsfw">NSFW</label>
    </div>

    <button class="submit-btn" type="submit">Го!</button>
  </form>

  <div id="result"></div>

  <script>
    let characters = [], genres = [], settings = [], kinks = [], situations = [], tropes = [], aus = [], ficKeywords = [];

    const titleFolders = {
      bleach: 'bleach',
      arcane: 'arcane',
      mha: 'mha',
      khr: 'khr',
      windbreaker: 'windbreaker'
    };

    async function loadDataForTitle(title) {
      const folder = titleFolders[title];
      try {
        const [charData, genreData, kinkData, tropeData, auData, keywordData] = await Promise.all([
          fetch(`assets/${folder}/characters.json`).then(r => r.json()),
          fetch('assets/genres.json').then(r => r.json()),
          fetch('assets/kinks.json').then(r => r.json()),
          fetch('assets/tropes.json').then(r => r.json()),
          fetch('assets/au.json').then(r => r.json()),
          fetch('assets/keywords.json').then(r => r.json())
        ]);

        characters = charData;
        genres = genreData;
        kinks = kinkData;
        tropes = tropeData;
        aus = auData;
        ficKeywords = keywordData;
      } catch (error) {
        console.error('Error loading data:', error);
      }
    }

    document.getElementById('title').addEventListener('change', (e) => {
      loadDataForTitle(e.target.value);
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadDataForTitle('bleach');
    });

    document.getElementById('ficForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const form = new FormData(e.target);
      const title = form.get('title') || 'bleach';

      await loadDataForTitle(title);

      const relationshipSize = parseInt(form.get('relationshipSize'), 10) || 1;
      const type = form.get('type') || 'gen';
      let sideCount = parseInt(form.get('sideCount'), 10);
      sideCount = isNaN(sideCount) ? 0 : sideCount;
      const nsfw = form.get('nsfw') === 'on';

      const factionOptions = [...document.getElementById('factions').selectedOptions];
      const selectedFactions = factionOptions.map(opt => opt.value);

      let genderFilter = () => true;
      if (type === 'slash') genderFilter = c => c.gender === 'male';
      if (type === 'femslash') genderFilter = c => c.gender === 'female';

      let factionFilter = () => true;
      if (selectedFactions.length > 0) {
        factionFilter = c => c.faction && selectedFactions.includes(c.faction);
      }

      const filteredChars = characters.filter(c => genderFilter(c) && factionFilter(c));

      const mainRelationship = getRandom(filteredChars, relationshipSize);

      const usedNames = new Set(mainRelationship.map(c => c.name));
      const remainingChars = characters.filter(c => !usedNames.has(c.name));
      const sideCharacters = getRandom(remainingChars, sideCount);

      const genre = getRandom(genres)[0];
      const au = getRandom(aus)[0];
      const trope = getRandom(tropes)[0];
      const kink = nsfw ? getRandom(kinks)[0] : null;
      const keywords = getRandom(ficKeywords, 3);

      const resultDiv = document.getElementById('result');

      resultDiv.innerHTML = `<p><strong>Генерируем фичок...</strong></p>`;
      setTimeout(() => {
        resultDiv.innerHTML = `
          <div class="relationship">
            ${mainRelationship.map(c => `
              <div class="char">
                <img src="${c.image}" alt="${c.name}" class="char-icon" onerror="this.onerror=null;this.src='assets/noicon.jpg';">
                <p>${c.name}${c.faction ? ` <span class='faction-tag'>(${c.faction})</span>` : ''}</p>
              </div>
            `).join(`<span>${getEmoji()}</span>`)}
          </div>

          <p class='keywords'>«  ${keywords.join(' • ')}  »</p>

          <div class='info-block'>
            ${generateInfoRow('Жанр', 'genre', genre)}
            ${generateInfoRow('Троп', 'trope', trope)}
            ${generateInfoRow('AU', 'au', au)}
            ${kink ? generateInfoRow('Кинк', 'kink', kink) : ''}
          </div>

          ${sideCharacters.length > 0 ? `
            <h3>Второстепенные персонажи</h3>
              <div class="side-chars">
                ${sideCharacters.map(c => `
                  <div class="char">
                    <img src="${c.image}" alt="${c.name}" class="char-icon" onerror="this.onerror=null;this.src='assets/noicon.jpg';">
                    <p>${c.name}${c.faction ? ` <span class='faction-tag'>(${c.faction})</span>` : ''}</p>
                  </div>
                `).join('')}
              </div>
          ` : ''}
        `;
      }, 500);
    });

    function generateInfoRow(label, type, item) {
      if (!item) return '';
      return `
        <div class='info-row ${type}'>
          <div class='info-label'>
            ${label}
            <button class="refresh-btn" data-type="${type}">
              <svg class="refresh-icon" viewBox="0 0 24 24">
                <path d="M12 4V1L8 5l4 4V6c3.3 0 6 2.7 6 6 0 1.1-.3 2.1-.8 3h2.1c.5-1 0-2 0-3 0-4.4-3.6-8-8-8zm-6 6c0-1.1.3-2.1.8-3H4.7C4.2 7 4 8 4 9c0 4.4 3.6 8 8 8v3l4-4-4-4v3c-3.3 0-6-2.7-6-6z" fill="currentColor"/>
              </svg>
            </button>
          </div>
          <div class='info-value'>
            <span class='${type}-name'>${item.name}</span><br>
            <span class='info-description ${type}-description'>${item.description || '—'}</span>
          </div>
        </div>`;
    }

    document.addEventListener('click', function (e) {
      const refreshBtn = e.target.closest('.refresh-btn');
      if (!refreshBtn) return;

      const type = refreshBtn.dataset.type;
      let container = refreshBtn.closest(`.${type}`);
      if (!container) return console.warn(`Missing .${type} wrapper`);

      const dataMap = {
        genre: [getRandom(genres)[0], 'genre-name', 'genre-description'],
        trope: [getRandom(tropes)[0], 'trope-name', 'trope-description'],
        au: [getRandom(aus)[0], 'au-name', 'au-description'],
        kink: [getRandom(kinks)[0], 'kink-name', 'kink-description']
      };

      const [newItem, nameClass, descClass] = dataMap[type] || [];
      if (!newItem) return;
      container.querySelector(`.${nameClass}`).textContent = newItem.name;
      container.querySelector(`.${descClass}`).textContent = newItem.description || '—';
    });

    function getRandom(arr, count = 1) {
      const copy = [...arr];
      const picks = [];
      while (count-- && copy.length) {
        const i = Math.floor(Math.random() * copy.length);
        picks.push(copy.splice(i, 1)[0]);
      }
      return picks;
    }

    function getEmoji() {
      const emojis = ['❤️', '✨', '⚔️', '❄️', '🔥', '⚡️', '☠️', '🍓', '🌙', '💀', '🩸', '🌸', '🕊️', '🧨', '🔮'];
      return emojis[Math.floor(Math.random() * emojis.length)];
    }
  </script>
</body>
</html>
